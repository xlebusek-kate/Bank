openapi: 3.1.0
info:
  title: OpenAPI definition
  version: v0
servers:
- url: http://localhost:8081
  description: Generated server url
paths:
  /rule:
    get:
      tags:
      - bank-controller
      operationId: getRules
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DataFromMethodGet"
    post:
      tags:
      - bank-controller
      operationId: saveRuleQueryDTO
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RuleQueryDTO"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RuleQueryDTO"
  /management/clear-caches:
    post:
      tags:
      - management-controller
      operationId: clearCaches
      responses:
        "200":
          description: OK
  /recommendation/{user_id}:
    get:
      tags:
      - bank-controller
      operationId: listRecommendation
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/FullRecommendationsDTO"
  /management/info:
    get:
      tags:
      - management-controller
      operationId: getInfo
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
                additionalProperties:
                  type: string
  /rule/{product_id}:
    delete:
      tags:
      - bank-controller
      operationId: delete
      parameters:
      - name: product_id
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
components:
  schemas:
    RuleQuery:
      type: object
      properties:
        query:
          type: string
        arguments:
          type: array
          items:
            type: string
        negate:
          type: boolean
    RuleQueryDTO:
      type: object
      properties:
        product_name:
          type: string
        product_id:
          type: string
        product_text:
          type: string
        rule:
          type: array
          items:
            $ref: "#/components/schemas/RuleQuery"
    DataFromMethodGet:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ObjectFromMethodGet"
    ObjectFromMethodGet:
      type: object
      properties:
        id:
          type: integer
          format: int64
        product_name:
          type: string
        product_id:
          type: string
        product_text:
          type: string
        rule:
          type: array
          items:
            $ref: "#/components/schemas/RuleQuery"
    FullRecommendationsDTO:
      type: object
      properties:
        user_id:
          type: string
        recommendations:
          type: array
          items:
            $ref: "#/components/schemas/RecommendationsDTO"
    RecommendationsDTO:
      type: object
      properties:
        name:
          type: string
        id:
          type: string
        text:
          type: string
